#cloud-config
# Template cloud-init VM lab IAM — dirender build-lab.ps1 (placeholder {{…}}) ke ISO seed 'cidata'.
hostname: {{HOSTNAME}}
fqdn: {{HOSTNAME}}.iamlab.test
prefer_fqdn_over_hostname: false
manage_etc_hosts: false
timezone: Asia/Jakarta
users:
  - name: {{LABADMIN}}
    gecos: Admin lokal lab
    groups: [sudo, adm]
    shell: /bin/bash
    lock_passwd: false
    sudo: "ALL=(ALL) ALL"
chpasswd:
  expire: false
  users:
    - {name: {{LABADMIN}}, password: "{{LABADMIN_PASS}}", type: text}
ssh_pwauth: true
write_files:
  # Tanpa DNS server di lab: nama layanan & DC ditetapkan di sini (rencana jaringan kanonik).
  - path: /etc/hosts
    permissions: '0644'
    content: |
      127.0.0.1 localhost
      127.0.1.1 {{HOSTNAME}}.iamlab.test {{HOSTNAME}}
      # >>> lab-iam (dibuat build-lab.ps1)
      10.10.10.5  dc1.iamlab.test dc1
      10.10.10.5  kc.iamlab.test app.iamlab.test saml.iamlab.test grafana.iamlab.test bao.iamlab.test mail.iamlab.test pam.iamlab.test
      10.10.10.20 srv1.iamlab.test srv1
      10.10.10.30 client1.iamlab.test client1
      # <<< lab-iam
      ::1 localhost ip6-localhost ip6-loopback
  - path: /etc/motd
    content: |
      Lab IAM — {{HOSTNAME}}.iamlab.test ({{ROLE}})
        Join domain   : sudo join-domain.sh        (Sesi 1)
        CIS Benchmark : sudo cis-scan.sh           (Sesi 1)
runcmd:
  - [sh, -c, "echo IAMLAB_PROVISION_START > /dev/ttyS0"]
  # payload (lab/) ada di ISO seed yang sama dengan berkas ini
  - [sh, -c, "mkdir -p /mnt/seed /opt/iamlab && mount -o ro LABEL=cidata /mnt/seed || mount -o ro /dev/sr0 /mnt/seed"]
  - [sh, -c, "tar -xf /mnt/seed/payload.tar -C /opt/iamlab && umount /mnt/seed"]
  - [sh, -c, "AUTOJOIN={{AUTOJOIN}} ADMIN_PASS='{{ADMIN_PASS}}' bash /opt/iamlab/lab/scripts/provision-vm.sh {{ROLE}} > /var/log/iamlab-provision.log 2>&1 && echo IAMLAB_PROVISION_DONE > /dev/ttyS0 || (tail -5 /var/log/iamlab-provision.log > /dev/ttyS0; echo IAMLAB_PROVISION_FAIL > /dev/ttyS0)"]
  # cloud-init tidak dijalankan lagi setelah build (seed & NIC NAT dilepas)
  - [touch, /etc/cloud/cloud-init.disabled]
power_state:
  mode: poweroff
  delay: now
  timeout: 120
  condition: true

# Lab IAM — stack Docker (Keycloak, OpenBao, Warpgate, monitoring, apps).
# Jalan di Docker Desktop (WSL2) pada PC Windows peserta (dibangun oleh build-lab.ps1).
# AD/LDAP = container samba-dc (dc1.iamlab.test). VM VirtualBox srv1 & client1 (Ubuntu)
# bergabung ke domain lewat port yang dipublikasikan di 10.10.10.5 (adapter Host-Only host).
#
# Prinsip lab: infrastruktur BERJALAN tetapi belum aman/kosong.
# Peserta mengonfigurasi keamanan (realm, federasi, MFA, policy, dashboard, dll).
#
# Pakai: cp .env.example .env && docker compose up -d
# Versi image sengaja dipin; verifikasi/di-bump saat build final.

name: iamlab

x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

networks:
  iamnet:
    driver: bridge

volumes:
  pg-data:
  komentar-data:
  kc-data:
  bao-data:
  warpgate-data:
  loki-data:
  grafana-data:
  samba-data:
  samba-etc:

services:
  # ---------- Edge: reverse proxy + TLS internal CA ----------
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    networks:
      iamnet:
        # agar container lain dapat me-resolve subdomain lab ke Caddy
        aliases:
          - kc.${LAB_DOMAIN}
          - app.${LAB_DOMAIN}
          - saml.${LAB_DOMAIN}
          - grafana.${LAB_DOMAIN}
          - bao.${LAB_DOMAIN}
          - mail.${LAB_DOMAIN}
          - pam.${LAB_DOMAIN}
    logging: *default-logging

  # ---------- Direktori ----------
  # DC = service samba-dc (bawah); container lain menjangkaunya lewat alias dc1.iamlab.test.

  # ---------- IdP: Keycloak + PostgreSQL ----------
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes: [pg-data:/var/lib/postgresql/data]
    networks: [iamnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    restart: unless-stopped
    command: ["start", "--optimized=false"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      # Di belakang Caddy (TLS diterminasi di proxy). Peserta memperketat lebih lanjut.
      KC_HOSTNAME: https://kc.${LAB_DOMAIN}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Emit event ke stdout JSON agar bisa dipungut Alloy.
      KC_LOG_CONSOLE_OUTPUT: json
      # Listener jboss-logging mencatat event sukses (LOGIN) di DEBUG → naikkan ke info
      # agar login berhasil muncul di log/Loki (gagal tetap di warn/error).
      KC_SPI_EVENTS_LISTENER_JBOSS_LOGGING_SUCCESS_LEVEL: info
      KC_SPI_EVENTS_LISTENER_JBOSS_LOGGING_ERROR_LEVEL: warn
    volumes:
      # CA AD (ad-ca.pem, diekspor dari DC di Sesi 1) → Keycloak 26 otomatis memercayai
      # semua sertifikat di conf/truststores → federasi ldaps://dc1.iamlab.test:636 lolos TLS.
      - ./certs:/opt/keycloak/conf/truststores:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [iamnet]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000; echo -e 'GET /health/ready HTTP/1.1\\nhost: localhost\\nConnection: close\\n\\n' >&3; cat <&3 | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *default-logging

  # ---------- SMTP uji (reset & kirim sandi) ----------
  mailpit:
    image: axllent/mailpit:v1.21.0
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP — import-ad.sh (Sesi 1) & VM lab dapat mengirim email ke Mailpit
    networks: [iamnet]
    logging: *default-logging

  # ---------- Aplikasi demo ----------
  app-komentar:
    build: ./app-komentar
    restart: unless-stopped
    environment:
      OIDC_ISSUER: https://kc.${LAB_DOMAIN}/realms/iamlab
      OIDC_CLIENT_ID: ${APP_OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${APP_OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: https://app.${LAB_DOMAIN}/callback
      APP_BASE_URL: https://app.${LAB_DOMAIN}
      FLASK_SECRET: ${APP_FLASK_SECRET}
      # Verifikasi TLS internal CA dimatikan di sisi app karena issuer memakai CA lab;
      # di lab ini app mengambil OIDC discovery via Caddy. Peserta dapat menanam CA.
      OIDC_VERIFY_TLS: "false"
    volumes:
      - komentar-data:/data     # agar komentar bertahan antar-restart
    depends_on: [caddy]
    networks: [iamnet]
    logging: *default-logging

  app-saml:
    build: ./app-saml
    restart: unless-stopped
    networks: [iamnet]
    logging: *default-logging

  # ---------- PAM ----------
  openbao:
    image: openbao/openbao:2.1.0
    restart: unless-stopped
    # entrypoint image sudah menambah -config=/openbao/config (memuat config.hcl).
    # Jangan menambah -config lagi → listener 8200 akan dimuat dua kali (bind error).
    command: ["server"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - ./openbao/config.hcl:/openbao/config/config.hcl:ro
      - bao-data:/openbao/file
      - ./certs:/openbao/certs:ro     # CA AD utk auth LDAP (certificate=@/openbao/certs/ad-ca.pem)
    networks: [iamnet]
    logging: *default-logging

  warpgate:
    image: ghcr.io/warp-tech/warpgate:0.28.3
    # restart "no": config /data/warpgate.yaml belum ada sampai setup (Sesi 3) →
    # cegah crash-loop. Jalankan setup lalu `docker compose up -d warpgate`.
    restart: "no"
    # Pertama kali (sekali): `docker compose run --rm warpgate unattended-setup --data-path /data --http-port 8888 --ssh-port 2222 --record-sessions --host-key-verification auto-accept --admin-password <sandi> --external-host pam.iamlab.test`
    # lalu service ini menjalankan `run`. Peserta mengonfigurasi SSO & target.
    command: ["run"]
    environment:
      WARPGATE_CONFIG: /data/warpgate.yaml
    volumes:
      - warpgate-data:/data
    ports:
      - "2222:2222"   # SSH bastion
    networks: [iamnet]
    logging: *default-logging

  # ---------- Audit & Monitoring ----------
  loki:
    image: grafana/loki:3.3.0
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    # Dipublikasikan agar Alloy di VM DC dapat mengirim Windows Event (Sesi 4):
    # http://10.10.10.5:3100/loki/api/v1/push
    ports: ["3100:3100"]
    networks: [iamnet]
    logging: *default-logging

  alloy:
    image: grafana/alloy:v1.5.1
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [iamnet]
    logging: *default-logging

  grafana:
    image: grafana/grafana-oss:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_DEFAULT_THEME: light
      GF_SERVER_ROOT_URL: https://grafana.${LAB_DOMAIN}
      # SMTP ke Mailpit agar alert email (Sesi 4) berfungsi — hanya via env, bukan UI.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailpit:1025
      GF_SMTP_FROM_ADDRESS: grafana@${LAB_DOMAIN}
      GF_SMTP_SKIP_VERIFY: "true"
      # Logs Drilldown (Explore → Drilldown → Logs): discovery label/field/pola tanpa menulis
      # LogQL — dipakai menelusuri aktivitas user (Sesi 4). Terunduh saat build (online),
      # lalu tersimpan di volume grafana-data sehingga tetap ada saat lab offline.
      GF_PLUGINS_PREINSTALL: grafana-lokiexplore-app
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on: [loki]
    networks: [iamnet]
    logging: *default-logging

  # ---------- Load generator ----------
  locust:
    image: locustio/locust:2.32.4
    profiles: ["load"]       # tidak autorun; mulai di Sesi 4 (capstone): docker compose --profile load up -d locust
    restart: unless-stopped
    command: ["-f", "/mnt/locust/locustfile.py", "--host", "https://app.${LAB_DOMAIN}"]
    environment:
      LAB_PROFILE: ${LAB_PROFILE:-normal}          # normal | spray | fail-then-success | off-hours
      LAB_TEST_USER: ${LAB_TEST_USER:-}            # akun uji (sandi sudah permanen) utk login sukses
      LAB_TEST_PASS: ${LAB_TEST_PASS:-}
    volumes:
      - ./loadgen:/mnt/locust:ro
    ports: ["8089:8089"]
    networks: [iamnet]
    logging: *default-logging

  # ---------- Simulasi serangan (LAB-ONLY, tidak start default) ----------
  attacker:
    build: ../attack-sim
    profiles: ["attack"]          # aktif hanya dengan: docker compose --profile attack up attacker
    entrypoint: ["sleep", "infinity"]
    volumes:
      - ../attack-sim:/attack-sim:ro
    networks: [iamnet]
    logging: *default-logging

  # ---------- Direktori: Samba AD DC (dc1.iamlab.test) — Sesi 1 ----------
  # AD/LDAP lab untuk VM Ubuntu srv1 & client1 serta sumber federasi Keycloak/OpenBao.
  # Port 53/135/445 SENGAJA tidak dipublikasikan (bentrok layanan Windows host); klien lab
  # join via adcli/sssd dengan server ditunjuk langsung (lihat lab/scripts/join-domain.sh).
  samba-dc:
    build: ./samba-dc
    image: iamlab-samba-dc
    restart: unless-stopped
    hostname: dc1
    domainname: iamlab.test
    privileged: true          # Samba AD butuh xattr/ACL penuh pada sysvol
    environment:
      REALM: IAMLAB.TEST
      DOMAIN: IAMLAB
      HOST_NAME: dc1
      ADMIN_PASS: ${SAMBA_ADMIN_PASS:-Passw0rd#Lab2026}
    ports:
      - "88:88/tcp"
      - "88:88/udp"
      - "389:389/tcp"
      - "389:389/udp"
      - "464:464/tcp"
      - "464:464/udp"
      - "636:636/tcp"
      - "3268:3268/tcp"
      - "3269:3269/tcp"
    volumes:
      - samba-data:/var/lib/samba
      - samba-etc:/etc/samba
    networks:
      iamnet:
        aliases: [dc1.iamlab.test]
    logging: *default-logging
